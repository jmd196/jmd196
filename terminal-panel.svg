<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="474" viewBox="0 0 1200 474" role="img" aria-labelledby="title desc">
  <title id="title">jmd196 — interactive profile terminal</title>
  <desc id="desc">A terminal showing whoami, projects, club, tools, links, and clear commands. Click to open the working interactive terminal.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101922"/>
      <stop offset="100%" stop-color="#090f16"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#51DFC2"/>
      <stop offset="60%" stop-color="#58B9EF"/>
      <stop offset="100%" stop-color="#39C9C4"/>
    </linearGradient>
    <clipPath id="clip"><rect x="1" y="1" width="1198" height="472" rx="18"/></clipPath>
  </defs>
  <rect x="1" y="1" width="1198" height="472" rx="18" fill="url(#background)" stroke="#2D4052" stroke-width="2"/>
  <g clip-path="url(#clip)">
    <rect x="2" y="2" width="1196" height="68" fill="#1C2834"/>
    <path d="M2 69 H1198" stroke="#344659" stroke-width="1.5"/>
    <rect x="2" y="70" width="5" height="402" fill="url(#accent)"/>
    <path d="M44 396 H1153" stroke="#263747" stroke-width="1"/>
  </g>
  <circle cx="36" cy="35" r="8" fill="#ED7472"/>
  <circle cx="65" cy="35" r="8" fill="#E8BE67"/>
  <circle cx="94" cy="35" r="8" fill="#66C79C"/>
  <rect x="145" y="11" width="355" height="58" rx="11" fill="#101923"/>
  <path d="M173 29l9 7-9 7m16 0h14" fill="none" stroke="#66DCC3" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="220" y="44" font-family="Menlo,Consolas,'Liberation Mono',monospace" font-size="22" fill="#C2D1DE">jmd196 — ~/github</text>

  <text x="46" y="131" font-family="Menlo,Consolas,'Liberation Mono',monospace" font-size="28" fill="#60DEBD">&gt;</text>
  <text x="88" y="131" font-family="Menlo,Consolas,'Liberation Mono',monospace" font-size="28" fill="#F1F7FC">help</text>
  <text x="48" y="185" font-family="Menlo,Consolas,'Liberation Mono',monospace" font-size="17" letter-spacing="2" fill="#8297AA">AVAILABLE COMMANDS</text>

  <text x="51" y="241" font-family="Menlo,Consolas,'Liberation Mono',monospace" font-size="26" fill="#78CFFF">whoami</text>
  <text x="243" y="241" font-family="Menlo,Consolas,'Liberation Mono',monospace" font-size="21" fill="#AFBECE">about</text>
  <text x="602" y="241" font-family="Menlo,Consolas,'Liberation Mono',monospace" font-size="26" fill="#78CFFF">club</text>
  <text x="778" y="241" font-family="Menlo,Consolas,'Liberation Mono',monospace" font-size="21" fill="#AFBECE">club activities</text>

  <text x="51" y="295" font-family="Menlo,Consolas,'Liberation Mono',monospace" font-size="26" fill="#78CFFF">projects</text>
  <text x="243" y="295" font-family="Menlo,Consolas,'Liberation Mono',monospace" font-size="21" fill="#AFBECE">current work</text>
  <text x="602" y="295" font-family="Menlo,Consolas,'Liberation Mono',monospace" font-size="26" fill="#78CFFF">links</text>
  <text x="778" y="295" font-family="Menlo,Consolas,'Liberation Mono',monospace" font-size="21" fill="#AFBECE">repositories</text>

  <text x="51" y="349" font-family="Menlo,Consolas,'Liberation Mono',monospace" font-size="26" fill="#78CFFF">tools</text>
  <text x="243" y="349" font-family="Menlo,Consolas,'Liberation Mono',monospace" font-size="21" fill="#AFBECE">platforms</text>
  <text x="602" y="349" font-family="Menlo,Consolas,'Liberation Mono',monospace" font-size="26" fill="#78CFFF">clear</text>
  <text x="778" y="349" font-family="Menlo,Consolas,'Liberation Mono',monospace" font-size="21" fill="#AFBECE">reset</text>

  <text x="49" y="446" font-family="Menlo,Consolas,'Liberation Mono',monospace" font-size="27" fill="#60DEBD">&gt;</text>
  <rect x="90" y="424" width="13" height="26" rx="1" fill="#A4D8D4"/>
  <text x="1115" y="441" font-family="Menlo,Consolas,'Liberation Mono',monospace" font-size="19" text-anchor="end" fill="#69CCDC">OPEN INTERACTIVE TERMINAL</text>
  <path d="M1127 446 L1148 425 M1133 425 H1148 V440" fill="none" stroke="#69CCDC" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
