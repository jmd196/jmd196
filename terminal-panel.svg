<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="344" viewBox="0 0 1200 344" role="img" aria-labelledby="title desc">
<title id="title">Interactive GitHub profile terminal preview</title>
<desc id="desc">A terminal window with text and a prompt. Click the image to open the working interactive terminal.</desc>
<defs>
  <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
    <stop offset="0" stop-color="#0d141d"/>
    <stop offset="1" stop-color="#0b1018"/>
  </linearGradient>
  <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#35d7ce"/>
    <stop offset=".55" stop-color="#459fe3"/>
    <stop offset="1" stop-color="#4bd8ac"/>
  </linearGradient>
  <clipPath id="round"><rect x="2" y="2" width="1196" height="340" rx="19"/></clipPath>
</defs>
<rect x="1" y="1" width="1198" height="342" rx="20" fill="url(#bg)" stroke="#263a48" stroke-width="2"/>
<g clip-path="url(#round)">
<rect x="2" y="2" width="1196" height="56" fill="#1b2530"/>
<path d="M2 57 H1198" stroke="#344452"/>
<rect x="2" y="58" width="5" height="284" fill="url(#line)" opacity=".82"/>
</g>
<circle cx="32" cy="30" r="8" fill="#ef7069"/>
<circle cx="58" cy="30" r="8" fill="#edbe62"/>
<circle cx="84" cy="30" r="8" fill="#68c995"/>
<rect x="138" y="11" width="244" height="46" rx="12" fill="#0d141d"/>
<path d="M163 27l8 6-8 6m17 0h12" fill="none" stroke="#7fd7ca" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="210" y="40" font-family="Menlo, Consolas, 'Liberation Mono', monospace" font-size="21" fill="#aeb9c5">jmd196 — ~/github</text>
<text x="33" y="104" font-family="Menlo, Consolas, 'Liberation Mono', monospace" font-size="25" fill="#5de1be">&gt;</text>
<text x="70" y="104" font-family="Menlo, Consolas, 'Liberation Mono', monospace" font-size="25" fill="#edf5fc">cat about.txt</text>
<text x="70" y="148" font-family="Menlo, Consolas, 'Liberation Mono', monospace" font-size="24" fill="#b3c0cf">Coursework, Python practice, and side projects.</text>
<text x="33" y="208" font-family="Menlo, Consolas, 'Liberation Mono', monospace" font-size="25" fill="#5de1be">&gt;</text>
<text x="70" y="208" font-family="Menlo, Consolas, 'Liberation Mono', monospace" font-size="25" fill="#edf5fc">ls projects/</text>
<text x="70" y="251" font-family="Menlo, Consolas, 'Liberation Mono', monospace" font-size="23" fill="#79caff">discord-bot/</text>
<text x="328" y="251" font-family="Menlo, Consolas, 'Liberation Mono', monospace" font-size="23" fill="#79caff">security-labs/</text>
<text x="647" y="251" font-family="Menlo, Consolas, 'Liberation Mono', monospace" font-size="23" fill="#79caff">python-practice/</text>
<text x="33" y="310" font-family="Menlo, Consolas, 'Liberation Mono', monospace" font-size="25" fill="#5de1be">&gt;</text>
<rect x="70" y="286" width="14" height="27" rx="1" fill="#a8d7d4"/>
</svg>
